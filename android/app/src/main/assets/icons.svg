<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- ========== NAV ICONS ========== -->

  <symbol id="icon-list" viewBox="0 0 24 24">
    <path d="M4 5h16M4 12h16M4 19h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="8" cy="5" r="1.5" fill="currentColor"/>
    <circle cx="8" cy="12" r="1.5" fill="currentColor"/>
    <circle cx="8" cy="19" r="1.5" fill="currentColor"/>
  </symbol>

  <symbol id="icon-radar" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
    <circle cx="12" cy="12" r="6" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.6"/>
    <circle cx="12" cy="12" r="2" fill="currentColor"/>
    <line x1="12" y1="2" x2="12" y2="6" stroke="currentColor" stroke-width="2.5"/>
  </symbol>

  <symbol id="icon-stats" viewBox="0 0 24 24">
    <rect x="3" y="14" width="4" height="7" rx="1" fill="currentColor" opacity="0.7"/>
    <rect x="10" y="8" width="4" height="13" rx="1" fill="currentColor" opacity="0.85"/>
    <rect x="17" y="3" width="4" height="18" rx="1" fill="currentColor"/>
  </symbol>

<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">

  <!-- ========== NO INFO / UNKNOWN ========== -->
  <symbol id="cat-no-info" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M10.5 9.5 C10.5 8.5 11.2 7.5 12.5 7.5 C13.8 7.5 14.5 8.3 14.5 9.3 C14.5 10.5 13.5 11.2 12.5 12 C12.2 12.2 12 12.8 12 13.5 V14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12" cy="17" r="1.25" fill="currentColor"/>
  </symbol>

  <!-- ========== A-SERIES / L-SERIES: FIXED-WING AIRCRAFT ========== -->

  <!-- A1: Surface Ground Vehicle / Ground Support -->
  <symbol id="cat-a1" viewBox="0 0 24 24">
    <path d="M4 15 L5.5 9.5 C5.8 8.6 6.6 8 7.5 8 H16.5 C17.4 8 18.2 8.6 18.5 9.5 L20 15 Z" fill="currentColor"/>
    <rect x="2" y="14" width="20" height="4" rx="1.5" fill="currentColor"/>
    <circle cx="6.5" cy="18.5" r="2" fill="currentColor"/>
    <circle cx="17.5" cy="18.5" r="2" fill="currentColor"/>
  </symbol>

  <!-- A2 / L1: Small Light Aircraft (Piston Single) -->
  <symbol id="cat-a2" viewBox="0 0 24 24">
    <path d="M11 2 C11 2 12 1 12 1 C12 1 13 2 13 2 L13 9.5 L22 11.5 V13 L13 11.5 L13 18.5 L16 21 V22 L12 20.8 L8 22 V21 L11 18.5 L11 11.5 L2 13 V11.5 L11 9.5 Z" fill="currentColor"/>
  </symbol>

  <!-- A3: Medium Aircraft (Regional / Turboprop) -->
  <symbol id="cat-a3" viewBox="0 0 24 24">
    <path d="M11 2 C11 1.2 13 1.2 13 2 L13 9.5 L23 11 V13 L13 11.8 L13 18.5 L16.5 21 V22 L12 21 L7.5 22 V21 L11 18.5 L11 11.8 L1 13 V11 L11 9.5 Z" fill="currentColor"/>
  </symbol>

  <!-- A4: Large Jet (Single Aisle Airliner e.g. A320/B737) -->
  <symbol id="cat-a4" viewBox="0 0 24 24">
    <path d="M12 1 C11.2 1 10.8 3 10.8 5 L10.8 9 L1.5 13 V15 L10.8 12.8 L10.8 18.5 L7 21 V22.5 L12 21.2 L17 22.5 V21 L13.2 18.5 L13.2 12.8 L22.5 15 V13 L13.2 9 L13.2 5 C13.2 3 12.8 1 12 1 Z" fill="currentColor"/>
  </symbol>

  <!-- A5: High Vortex / Heavy Jet Dynamics -->
  <symbol id="cat-a5" viewBox="0 0 24 24">
    <!-- Base large plane -->
    <path d="M12 2 C11.2 2 10.8 4 10.8 6 L10.8 9.5 L2 13.5 V15 L10.8 13 L10.8 18.5 L7.5 21 V22 L12 21 L16.5 22 V21 L13.2 18.5 L13.2 13 L22 15 V13.5 L13.2 9.5 L13.2 6 C13.2 4 12.8 2 12 2 Z" fill="currentColor"/>
    <!-- Wingtip Vortices -->
    <path d="M1.5 11.5 C 0.5 9.5, 3 8, 3.5 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M22.5 11.5 C 23.5 9.5, 21 8, 20.5 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </symbol>

  <!-- A6: Heavy Wide-Body Airliner (4-Engine / Double Deck e.g. B747/A380) -->
  <symbol id="cat-a6" viewBox="0 0 24 24">
    <path d="M12 0.5 C10.8 0.5 10.5 3 10.5 6 L10.5 9 L1 12.5 V15 L10.5 12.5 L10.5 18 L6.5 21 V22.5 L12 21 L17.5 22.5 V21 L13.5 18 L13.5 12.5 L23 15 V12.5 L13.5 9 L13.5 6 C13.5 3 13.2 0.5 12 0.5 Z" fill="currentColor"/>
    <!-- Nacelles/Engines detail -->
    <path d="M5 11.5 H6.5 M8 10.5 H9.5 M14.5 10.5 H16 M17.5 11.5 H19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <!-- A7 / C4 / L5: Helicopter / Rotorcraft -->
  <symbol id="cat-a7" viewBox="0 0 24 24">
    <!-- Rotors -->
    <line x1="2" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="2" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <!-- Fuselage -->
    <circle cx="12" cy="12" r="5" fill="currentColor"/>
    <!-- Tail -->
    <path d="M12 17 L12 22 M10 22 H14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- ========== B-SERIES: SPECIAL / LIGHT ========== -->

  <!-- B1 / C5 / L6: Glider -->
  <symbol id="cat-b1" viewBox="0 0 24 24">
    <path d="M11.2 1 C11.2 1 12.8 1 12.8 1 L12.8 10.5 L24 11.5 V12.5 L12.8 12 L12.8 20.5 L16 22 V23 L12 22 L8 23 V22 L11.2 20.5 L11.2 12 L0 12.5 V11.5 L11.2 10.5 Z" fill="currentColor"/>
  </symbol>

  <!-- B2 / C6 / L7: Lighter-than-air (Hot Air Balloon) -->
  <symbol id="cat-b2" viewBox="0 0 24 24">
    <path d="M12 2 C7.5 2 4 5.5 4 10 C4 13.5 6.5 16 9 18.5 L9 20 H15 L15 18.5 C17.5 16 20 13.5 20 10 C20 5.5 16.5 2 12 2 Z" fill="currentColor"/>
    <rect x="10" y="21" width="4" height="2.5" rx="0.5" fill="currentColor"/>
  </symbol>

  <!-- B3: Parachutist / Paraglider -->
  <symbol id="cat-b3" viewBox="0 0 24 24">
    <path d="M3 10 C 3 4, 21 4, 21 10 Z" fill="currentColor"/>
    <line x1="4" y1="10" x2="11" y2="17" stroke="currentColor" stroke-width="1.2"/>
    <line x1="9" y1="10" x2="11.5" y2="17" stroke="currentColor" stroke-width="1.2"/>
    <line x1="15" y1="10" x2="12.5" y2="17" stroke="currentColor" stroke-width="1.2"/>
    <line x1="20" y1="10" x2="13" y2="17" stroke="currentColor" stroke-width="1.2"/>
    <circle cx="12" cy="19" r="1.5" fill="currentColor"/>
  </symbol>

  <!-- B4: Skydiving Drop Plane -->
  <symbol id="cat-b4" viewBox="0 0 24 24">
    <!-- Plane Base -->
    <path d="M11 2 L13 2 L13 9.5 L22 11.5 V13 L13 11.5 L13 18.5 L16 21 V22 L12 20.8 L8 22 V21 L11 18.5 L11 11.5 L2 13 V11.5 L11 9.5 Z" fill="currentColor"/>
    <!-- Diver Symbol underneath -->
    <circle cx="12" cy="15" r="1.5" fill="currentColor"/>
    <path d="M10 17.5 L12 16 L14 17.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </symbol>

  <!-- B5: Ultralight / Hang Glider -->
  <symbol id="cat-b5" viewBox="0 0 24 24">
    <path d="M12 3 L23 12 L18 12 L12 7 L6 12 L1 12 Z" fill="currentColor"/>
    <line x1="12" y1="7" x2="12" y2="20" stroke="currentColor" stroke-width="2"/>
    <path d="M8 17 L12 14 L16 17" stroke="currentColor" stroke-width="1.5" fill="none"/>
    <circle cx="12" cy="20" r="1.5" fill="currentColor"/>
  </symbol>

  <!-- ========== C-SERIES: SPECIFIC CATEGORIES ========== -->

  <!-- C1: Powered Lift / Tilt-Rotor (eVTOL / Osprey) -->
  <symbol id="cat-c1" viewBox="0 0 24 24">
    <path d="M11 3 L13 3 L13 9 L21 10.5 V12 L13 11 L13 18 L15.5 20.5 V21.5 L12 20.5 L8.5 21.5 V20.5 L11 18 L11 11 L3 12 V10.5 L11 9 Z" fill="currentColor"/>
    <!-- Rotors on Wingtips -->
    <line x1="1" y1="11.2" x2="5" y2="11.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="19" y1="11.2" x2="23" y2="11.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- C2: Military Fighter Jet -->
  <symbol id="cat-c2" viewBox="0 0 24 24">
    <path d="M12 1 L13.5 6 L22 14 V16 L13.5 12.5 L13.5 18 L16.5 21.5 V22.5 L12 21 L7.5 22.5 V21.5 L10.5 18 L10.5 12.5 L2 16 V14 L10.5 6 Z" fill="currentColor"/>
  </symbol>

  <!-- C3: Unknown -->
  <symbol id="cat-c3" viewBox="0 0 24 24">
    <use href="#cat-no-info"/>
  </symbol>

  <!-- C4: Helicopter Alias -->
  <symbol id="cat-c4" viewBox="0 0 24 24">
    <use href="#cat-a7"/>
  </symbol>

  <!-- C5: Glider Alias -->
  <symbol id="cat-c5" viewBox="0 0 24 24">
    <use href="#cat-b1"/>
  </symbol>

  <!-- C6: Balloon Alias -->
  <symbol id="cat-c6" viewBox="0 0 24 24">
    <use href="#cat-b2"/>
  </symbol>

  <!-- ========== D-SERIES & S-SERIES: EMERGENCY & MARITIME ========== -->

  <!-- D0: No info -->
  <symbol id="cat-d0" viewBox="0 0 24 24">
    <use href="#cat-no-info"/>
  </symbol>

  <!-- D1 / S1: Surface Ship / Vessel -->
  <symbol id="cat-d1" viewBox="0 0 24 24">
    <path d="M12 2 L19 8 L18 16 L12 21 L6 16 L5 8 Z" fill="currentColor"/>
    <circle cx="12" cy="10" r="2.5" fill="#ffffff" opacity="0.4"/>
  </symbol>

  <!-- D2: Emergency / Squawk 7700 -->
  <symbol id="cat-d2" viewBox="0 0 24 24">
    <path d="M12 2 L22 20 H2 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M12 8 V13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="12" cy="17" r="1.25" fill="currentColor"/>
  </symbol>

  <!-- ========== L-SERIES: SPECIFICS ========== -->

  <!-- L1: Landplane Single Engine -->
  <symbol id="cat-l1" viewBox="0 0 24 24">
    <use href="#cat-a2"/>
  </symbol>

  <!-- L2: Landplane Multi Engine (Twin Prop) -->
  <symbol id="cat-l2" viewBox="0 0 24 24">
    <path d="M11 2 C11 1.2 13 1.2 13 2 L13 9.5 L22 11 V13 L13 11.8 L13 18.5 L16.5 21 V22 L12 21 L7.5 22 V21 L11 18.5 L11 11.8 L2 13 V11 L11 9.5 Z" fill="currentColor"/>
    <!-- Engine Nacelles -->
    <rect x="6.5" y="9" width="1.5" height="4" rx="0.75" fill="currentColor"/>
    <rect x="16" y="9" width="1.5" height="4" rx="0.75" fill="currentColor"/>
  </symbol>

  <!-- L3: Seaplane / Amphibian Single Engine (Floats) -->
  <symbol id="cat-l3" viewBox="0 0 24 24">
    <!-- Plane Body -->
    <path d="M11 2 L13 2 L13 9.5 L22 11.5 V13 L13 11.5 L13 18.5 L16 21 V22 L12 20.8 L8 22 V21 L11 18.5 L11 11.5 L2 13 V11.5 L11 9.5 Z" fill="currentColor"/>
    <!-- Floats -->
    <rect x="5" y="7" width="2" height="9" rx="1" fill="currentColor" opacity="0.75"/>
    <rect x="17" y="7" width="2" height="9" rx="1" fill="currentColor" opacity="0.75"/>
  </symbol>

  <!-- L4: Seaplane / Amphibian Multi Engine -->
  <symbol id="cat-l4" viewBox="0 0 24 24">
    <path d="M11 2 L13 2 L13 9.5 L23 11 V13 L13 11.8 L13 18.5 L16.5 21 V22 L12 21 L7.5 22 V21 L11 18.5 L11 11.8 L1 13 V11 L11 9.5 Z" fill="currentColor"/>
    <!-- Twin Engine Nacelles -->
    <rect x="7" y="9" width="1.5" height="3.5" rx="0.75" fill="currentColor"/>
    <rect x="15.5" y="9" width="1.5" height="3.5" rx="0.75" fill="currentColor"/>
    <!-- Floats -->
    <rect x="4.5" y="7" width="2" height="10" rx="1" fill="currentColor" opacity="0.75"/>
    <rect x="17.5" y="7" width="2" height="10" rx="1" fill="currentColor" opacity="0.75"/>
  </symbol>

  <!-- L5, L6, L7 Aliases -->
  <symbol id="cat-l5" viewBox="0 0 24 24"><use href="#cat-a7"/></symbol>
  <symbol id="cat-l6" viewBox="0 0 24 24"><use href="#cat-b1"/></symbol>
  <symbol id="cat-l7" viewBox="0 0 24 24"><use href="#cat-b2"/></symbol>

  <!-- ========== S-SERIES: SURFACE SHIPS ========== -->

  <!-- S1: Surface Ship -->
  <symbol id="cat-s1" viewBox="0 0 24 24">
    <use href="#cat-d1"/>
  </symbol>

  <!-- S2: Emergency Surface / Rescue Boat -->
  <symbol id="cat-s2" viewBox="0 0 24 24">
    <path d="M12 2 L19 8 L18 16 L12 21 L6 16 L5 8 Z" fill="currentColor"/>
    <!-- Cross / Rescue Symbol -->
    <path d="M12 7 V13 M9 10 H15" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- S3: Surface Support Vessel -->
  <symbol id="cat-s3" viewBox="0 0 24 24">
    <path d="M12 2 L18 7 L17 17 L12 21 L7 17 L6 7 Z" fill="currentColor"/>
    <rect x="9" y="10" width="6" height="5" rx="1" fill="#ffffff" opacity="0.4"/>
  </symbol>

</svg>


</svg>
